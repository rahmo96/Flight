name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d test_db; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres... ($i)"; sleep 2
          done

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      # === אם אתה משתמש ב-PRISMA ===
      # - name: Prisma generate & migrate
      #   working-directory: ./backend
      #   run: |
      #     npx prisma generate
      #     npx prisma migrate deploy
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      # === אם אתה משתמש ב-SEQUELIZE ===
      # - name: Run Sequelize migrations
      #   working-directory: ./backend
      #   run: npx sequelize-cli db:migrate
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      # - name: (Optional) Seed DB
      #   working-directory: ./backend
      #   run: npx sequelize-cli db:seed:all
      #   env:
      #     DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run backend tests
        working-directory: ./backend
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npm test -- --watchAll=false --coverage
          mkdir -p ../artifacts/backend
          cp -r coverage ../artifacts/backend/ || true
          # אם יש junit:
          # cp junit.xml ../artifacts/backend/ || true

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: artifacts/backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        env:
          CI: true
        run: |
          npm test -- --watchAll=false --coverage
          mkdir -p ../artifacts/frontend
          cp -r coverage ../artifacts/frontend/ || true
          # אם יש junit:
          # cp junit.xml ../artifacts/frontend/ || true

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-artifacts
          path: artifacts/frontend
